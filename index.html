<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hvpord 工具页</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d7dde5;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .tool-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .tool {
      display: block;
      min-height: 150px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      transition: border-color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
    }

    .tool:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(31, 41, 55, 0.09);
    }

    .tool h2 {
      margin: 0 0 10px;
      font-size: 20px;
      line-height: 1.35;
    }

    .tool p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .path {
      display: inline-block;
      margin-top: 18px;
      color: var(--accent-dark);
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <h1>hvpord 工具页</h1>
    <p class="intro">这里放一些可以直接在浏览器里使用的小工具。工具数据由使用者自己录入，保存在本地浏览器中。</p>

    <section class="tool-list" aria-label="工具列表">
      <a class="tool" href="/advance-funding-calculator/">
        <h2>垫资应收款计算器</h2>
        <p>用于垫资、回款、税损和应收金额的本地计算。</p>
        <span class="path">/advance-funding-calculator/</span>
      </a>
      <a class="tool" href="/jump-monster-game/">
        <h2>跳怪兽游戏</h2>
        <p>之前制作的浏览器小游戏。</p>
        <span class="path">/jump-monster-game/</span>
      </a>
    </section>
  </main>
</body>
</html>
